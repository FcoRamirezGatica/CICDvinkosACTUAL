name: ETL Vinkos CI-CD Serverless
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    # PASO 1: Descargar el repositorio de GitHub en el runner para iniciar el despliegue.
    - name: Checkout Repository
      uses: actions/checkout@v3
    
    # PASO 2: Instalar herramientas necesarias para consumir las APIs de Databricks y procesar JSON.
    - name: Install jq & curl
      run: sudo apt-get update && sudo apt-get install -y jq curl
    
    # PASO 3: Exportar los notebooks desde el workspace origen de Databricks.
    - name: Export multiple notebooks (raw)
      run: |
        ORIGIN_HOST=${{ secrets.DATABRICKS_ORIGIN_HOST }}
        ORIGIN_TOKEN=${{ secrets.DATABRICKS_ORIGIN_TOKEN }}
        NOTEBOOK_BASE="/Workspace/Users/frank_vinkos@outlook.com/"  #Cambio.. ruta donde estan los notebooks
        NOTEBOOKS=("00.vinkos_Preparacion_Ambiente" "01.vinkos_Ingesta_bitacota_ctrl_file" "02.vinkos_ingesta_estadisticos" "03.Transform" "04.load_visitantes" "05.eliminar_raw" "select_tablas_vinko" ) 
        mkdir -p notebooks_to_deploy
        for nb in "${NOTEBOOKS[@]}"; do
          echo "Exportando $nb en modo raw..."
          curl -s -X GET \
            -H "Authorization: Bearer $ORIGIN_TOKEN" \
            "$ORIGIN_HOST/api/2.0/workspace/export?path=$NOTEBOOK_BASE/$nb&format=SOURCE&direct_download=true" \
            --output "notebooks_to_deploy/$nb.py"
        done
    
    # PASO 4: Importar los notebooks exportados al workspace destino.
    - name: Deploy notebooks to Destination Workspace
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        DEST_BASE="/py/vinkos"
        for file in notebooks_to_deploy/*.py; do
          name=$(basename "$file" .py)
          dest_path="$DEST_BASE/$name"
          echo "Creando carpeta $DEST_BASE si no existe..."
          curl -s -X POST \
            -H "Authorization: Bearer $DEST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"path\":\"$DEST_BASE\"}" \
            "$DEST_HOST/api/2.0/workspace/mkdirs"
          echo "Importando $file → $dest_path"
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $DEST_TOKEN" \
            -H "Content-Type: multipart/form-data" \
            -F "path=$dest_path" \
            -F "format=SOURCE" \
            -F "language=PYTHON" \
            -F "overwrite=true" \
            -F "content=@$file" \
            "$DEST_HOST/api/2.0/workspace/import")
          echo "Response: $response"
        done
    
    # PASO 5: Validar si WF_ETL_VINKOS ya existe en destino y eliminarlo antes de recrearlo.
    - name: Check if workflow exists and delete if necessary
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        WORKFLOW_NAME="WF_ETL_VINKOS"
        
        echo "Verificando si existe el workflow: $WORKFLOW_NAME"
        
        # Listar todos los workflows y buscar por nombre
        workflows_response=$(curl -s -X GET \
          -H "Authorization: Bearer $DEST_TOKEN" \
          "$DEST_HOST/api/2.1/jobs/list")
        
        # Extraer job_id si existe el workflow
        existing_job_id=$(echo "$workflows_response" | jq -r --arg name "$WORKFLOW_NAME" '.jobs[]? | select(.settings.name == $name) | .job_id')
        
        if [ "$existing_job_id" != "" ] && [ "$existing_job_id" != "null" ]; then
          echo "Workflow encontrado con ID: $existing_job_id. Eliminando..."
          delete_response=$(curl -s -X POST \
            -H "Authorization: Bearer $DEST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": $existing_job_id}" \
            "$DEST_HOST/api/2.1/jobs/delete")
          echo "Delete response: $delete_response"
        else
          echo "No se encontró workflow existente con nombre: $WORKFLOW_NAME"
        fi
    
    # PASO 6: Crear el Workflow completo con Serverless Compute.
    # Ya no se busca cluster_SD porque Azure no permite iniciar ese cluster por cuota de CPU.
    # Los notebook_task se crean sin existing_cluster_id para usar Serverless Compute.
    # También se incluye el IF ExisteArchivos para detener el flujo cuando RAW está vacío.
    - name: Create Databricks Workflow WF_ETL_VINKOS
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        DEST_BASE="/py/vinkos"
        
        echo "Creando workflow: WF_ETL_VINKOS con Serverless Compute"
        
        # Crear JSON del workflow. Al no declarar cluster en notebook_task, Databricks usa Serverless.
        cat > workflow_config.json << EOF
        {
          "name": "WF_ETL_VINKOS",
          "format": "MULTI_TASK",
          "tasks": [
            {
              "task_key": "PreparacionAmbiente",
              "description": "PASO AMBIENTE: crea y prepara catalogo, schemas, tablas y ubicaciones necesarias",
              "notebook_task": {
                "notebook_path": "/py/vinkos/00.vinkos_Preparacion_Ambiente",
                "source": "WORKSPACE",
                "base_parameters": {
                    "storageName": "adlsvinkoetl",
                    "catalogo": "etl_vinkos",
                    "container": "raw",
                    "schemaBronze": "bronze",
                    "schemaSilver": "silver",
                    "schemaGold": "gold",
                    "credential_": "etlcredential"
                    }
              },
              "timeout_seconds": 3600,
              "max_retries": 2
            },
            {
              "task_key": "IngestaBitacotaCtrlFile",
              "description": "PASO RAW/CONTROL: detecta TXT, genera hay_archivos y prepara la bitacora de archivos a procesar",
              "notebook_task": {
                "notebook_path": "/py/vinkos/01.vinkos_Ingesta_bitacota_ctrl_file",
                "source": "WORKSPACE",
                "base_parameters": {
                  "storageName": "adlsvinkoetl",
                  "catalogo": "etl_vinkos",
                  "container": "raw",
                  "esquema": "silver",
                  "esquemagold": "gold"
                }
              },
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [
                {
                  "task_key": "PreparacionAmbiente"
                }
              ]
            },
            {
              "task_key": "ExisteArchivos",
              "description": "IF de control: continua solo cuando IngestaBitacotaCtrlFile publica hay_archivos=true",
              "condition_task": {
                "op": "EQUAL_TO",
                "left": "{{tasks.IngestaBitacotaCtrlFile.values.hay_archivos}}",
                "right": "true"
              },
              "depends_on": [
                {
                  "task_key": "IngestaBitacotaCtrlFile"
                }
              ]
            },
            {
              "task_key": "IngestaEstadisticos",
              "description": "PASO BRONZE: ingesta los TXT solamente cuando ExisteArchivos devuelve true",
              "notebook_task": {
                "notebook_path": "/py/vinkos/02.vinkos_ingesta_estadisticos",
                "source": "WORKSPACE",
                "base_parameters": {
                  "container": "raw",
                  "catalogo": "etl_vinkos",
                  "esquema": "bronze",
                  "storageName": "adlsvinkoetl"
                }
              },
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [
                {
                  "task_key": "ExisteArchivos",
                  "outcome": "true"
                }
              ]
            },
            {
              "task_key": "Transform",
              "description": "PASO SILVER/TRANSFORM: valida calidad, separa errores y carga estadistica Gold",
              "notebook_task": {
                "notebook_path": "/py/vinkos/03.Transform",
                "source": "WORKSPACE",
                "base_parameters": {
                  "container": "raw",
                  "catalogo": "etl_vinkos",
                  "esquemabron": "bronze",
                  "storageName": "adlsvinkoetl",
                  "schemaSilver": "silver",
                  "esquemagold": "gold"
                }
              },
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [
                {
                  "task_key": "IngestaEstadisticos"
                }
              ]
            },
            {
              "task_key": "LoadVisitantes",
              "description": "PASO GOLD: consolida metricas por email y realiza MERGE sobre visitantes",
              "notebook_task": {
                "notebook_path": "/py/vinkos/04.load_visitantes",
                "source": "WORKSPACE",
                "base_parameters": {
                  "esquemagold": "gold",
                  "catalogo": "etl_vinkos"
                }
              },
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [
                {
                  "task_key": "Transform"
                }
              ]
            },
            {
              "task_key": "EliminarRaw",
              "description": "PASO BACKUP: comprime los TXT procesados, respalda en backup y elimina los originales de RAW",
              "notebook_task": {
                "notebook_path": "/py/vinkos/05.eliminar_raw",
                "source": "WORKSPACE",
                "base_parameters": {
                  "storageName": "adlsvinkoetl"
                }
              },
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [
                {
                  "task_key": "LoadVisitantes"
                }
              ]
            }
          ],
          "schedule": {
            "quartz_cron_expression": "0 0 8 * * ?",
            "timezone_id": "America/Lima",
            "pause_status": "PAUSED"
          },
          "email_notifications": {
            "on_failure": [],
            "on_success": [],
            "no_alert_for_skipped_runs": false
          },
          "webhook_notifications": {},
          "timeout_seconds": 7200,
          "max_concurrent_runs": 1,
          "tags": {
            "environment": "production",
            "created_by": "github_actions",
            "project": "automated_deployment",
            "compute": "serverless"
          }
        }
        EOF
        
        # Crear el workflow
        create_response=$(curl -s -X POST \
          -H "Authorization: Bearer $DEST_TOKEN" \
          -H "Content-Type: application/json" \
          -d @workflow_config.json \
          "$DEST_HOST/api/2.1/jobs/create")
        
        echo "Workflow creation response: $create_response"
        
        # Extraer job_id del response
        job_id=$(echo "$create_response" | jq -r '.job_id')
        
        if [ "$job_id" != "" ] && [ "$job_id" != "null" ]; then
          echo "✅ Workflow 'WF_ETL_VINKOS' creado exitosamente con ID: $job_id"
          
          # Obtener detalles del workflow creado
          workflow_details=$(curl -s -X GET \
            -H "Authorization: Bearer $DEST_TOKEN" \
            "$DEST_HOST/api/2.1/jobs/get?job_id=$job_id")
          
           echo "Detalles del workflow:"

          echo "$workflow_details" | jq '
          .settings |
          {
            name: .name,
            tasks: [
              .tasks[] |
              {
                task_key: .task_key,
                tipo: (
                  if .condition_task != null
                  then "IF_ELSE"
                  else "NOTEBOOK"
                  end
                ),
                notebook_path: (.notebook_task.notebook_path // null)
              }
            ]
          }'
        else
          echo "❌ Error al crear el workflow"
          echo "Response completo: $create_response"
          exit 1
        fi
    
    # PASO 7: Validar que el Workflow y todas sus tareas hayan quedado configurados correctamente.
    - name: Validate Workflow Configuration
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        WORKFLOW_NAME="WF_ETL_VINKOS"
        
        echo "🔍 Validando la configuración del workflow creado..."
        
        # Obtener lista de workflows y encontrar el recién creado
        workflows_list=$(curl -s -X GET \
          -H "Authorization: Bearer $DEST_TOKEN" \
          "$DEST_HOST/api/2.1/jobs/list")
        
        job_id=$(echo "$workflows_list" | jq -r --arg name "$WORKFLOW_NAME" '.jobs[]? | select(.settings.name == $name) | .job_id')
        
        if [ "$job_id" != "" ] && [ "$job_id" != "null" ]; then
          echo "✅ Workflow encontrado con ID: $job_id"
          
          # Obtener configuración detallada
          job_details=$(curl -s -X GET \
            -H "Authorization: Bearer $DEST_TOKEN" \
            "$DEST_HOST/api/2.1/jobs/get?job_id=$job_id")
          
          echo "📋 Resumen del workflow:"
          echo "Nombre: $(echo "$job_details" | jq -r '.settings.name')"
          echo "Número de tareas: $(echo "$job_details" | jq '.settings.tasks | length')"
          echo ""
          echo "📝 Tareas configuradas:"
          echo "$job_details" | jq -r '
          .settings.tasks[] |
          if .notebook_task then
            "- " + .task_key + " → Notebook: " + .notebook_task.notebook_path
          elif .condition_task then
            "- " + .task_key + " → IF/ELSE: " + .condition_task.left + " " + .condition_task.op + " " + .condition_task.right
          else
            "- " + .task_key + " → Otro tipo de tarea"
          end'
          echo ""
          echo "🖥️  Compute configurado:"
          echo "Serverless Compute para las tareas Notebook"
          echo "ExisteArchivos es una condition_task y no requiere compute propio."
          
        else
          echo "❌ No se pudo encontrar el workflow creado"
          exit 1
        fi
    
    # PASO 8: Ejecutar automáticamente el Workflow recién desplegado.
    - name: Execute Workflow WF_ETL_VINKOS
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        WORKFLOW_NAME="WF_ETL_VINKOS"
        
        echo "🚀 Ejecutando workflow: $WORKFLOW_NAME"
        
        # Obtener job_id del workflow
        workflows_list=$(curl -s -X GET \
          -H "Authorization: Bearer $DEST_TOKEN" \
          "$DEST_HOST/api/2.1/jobs/list")
        
        job_id=$(echo "$workflows_list" | jq -r --arg name "$WORKFLOW_NAME" '.jobs[]? | select(.settings.name == $name) | .job_id')
        
        if [ "$job_id" != "" ] && [ "$job_id" != "null" ]; then
          echo "✅ Workflow encontrado con ID: $job_id"
          
          # Ejecutar el workflow
          run_response=$(curl -s -X POST \
            -H "Authorization: Bearer $DEST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": $job_id}" \
            "$DEST_HOST/api/2.1/jobs/run-now")
          
          run_id=$(echo "$run_response" | jq -r '.run_id')
          
          if [ "$run_id" != "" ] && [ "$run_id" != "null" ]; then
            echo "🎯 Workflow ejecutado exitosamente!"
            echo "Run ID: $run_id"
            echo "WORKFLOW_RUN_ID=$run_id" >> $GITHUB_ENV
            echo "WORKFLOW_JOB_ID=$job_id" >> $GITHUB_ENV
            
            # Mostrar URL del workflow en ejecución
            echo "🔗 URL del workflow: $DEST_HOST/jobs/$job_id/runs/$run_id"
            
          else
            echo "❌ Error al ejecutar el workflow"
            echo "Response: $run_response"
            exit 1
          fi
        else
          echo "❌ No se pudo encontrar el workflow para ejecutar"
          exit 1
        fi
    
    # PASO 9: Monitorear la ejecución hasta terminar y reportar el resultado de cada tarea.
    - name: Monitor Workflow Execution
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        RUN_ID="${{ env.WORKFLOW_RUN_ID }}"
        JOB_ID="${{ env.WORKFLOW_JOB_ID }}"
        
        echo "📊 Monitoreando ejecución del workflow..."
        echo "Job ID: $JOB_ID"
        echo "Run ID: $RUN_ID"
        
        # Monitorear por máximo 10 minutos (600 segundos)
        max_wait_time=600
        wait_time=0
        check_interval=30
        
        while [ $wait_time -lt $max_wait_time ]; do
          # Obtener estado actual
          run_status=$(curl -s -X GET \
            -H "Authorization: Bearer $DEST_TOKEN" \
            "$DEST_HOST/api/2.1/jobs/runs/get?run_id=$RUN_ID")
          
          state=$(echo "$run_status" | jq -r '.state.life_cycle_state')
          result_state=$(echo "$run_status" | jq -r '.state.result_state // "RUNNING"')
          
          echo "⏱️  Estado actual: $state ($result_state) - Tiempo transcurrido: ${wait_time}s"
          
          # Mostrar progreso de las tareas
          echo "$run_status" | jq -r '.tasks[]? | "  📋 " + .task_key + ": " + .state.life_cycle_state + " (" + (.state.result_state // "RUNNING") + ")"'
          
          case "$state" in
            "TERMINATED")
              if [ "$result_state" = "SUCCESS" ]; then
                echo "🎉 ¡Workflow completado exitosamente!"
                
                # Mostrar resumen final
                echo ""
                echo "📈 Resumen de ejecución:"
                echo "$run_status" | jq -r '.tasks[]? | "✅ " + .task_key + " → " + (.state.result_state // "SUCCESS")'
                
                # Obtener duración
                start_time=$(echo "$run_status" | jq -r '.start_time')
                end_time=$(echo "$run_status" | jq -r '.end_time')
                if [ "$start_time" != "null" ] && [ "$end_time" != "null" ]; then
                  duration=$((($end_time - $start_time) / 1000))
                  echo "⏰ Duración total: ${duration} segundos"
                fi
                
                exit 0
              else
                echo "❌ Workflow terminó con errores: $result_state"
                echo "📋 Detalles de las tareas:"
                echo "$run_status" | jq -r '.tasks[]? | "❌ " + .task_key + ": " + (.state.result_state // "UNKNOWN")'
                exit 1
              fi
              ;;
            "INTERNAL_ERROR"|"SKIPPED")
              echo "❌ Workflow falló con estado: $state"
              exit 1
              ;;
            *)
              # Estados: PENDING, RUNNING, TERMINATING
              echo "⏳ Workflow aún ejecutándose..."
              ;;
          esac
          
          sleep $check_interval
          wait_time=$((wait_time + check_interval))
        done
        
        echo "⚠️  Timeout: El workflow aún se está ejecutando después de $max_wait_time segundos"
        echo "🔗 Verifica el estado en: $DEST_HOST/jobs/$JOB_ID/runs/$RUN_ID"
        echo "ℹ️  El workflow seguirá ejecutándose en Databricks"
        exit 0
    
    # PASO 10: Limpiar archivos temporales generados durante el despliegue.
    - name: Clean up
      run: |
        rm -rf notebooks_to_deploy
        rm -f workflow_config.json create_response.json
    
    # PASO 11: Mostrar el resumen final del proceso CI/CD.
    - name: Done
      run: |
        echo "🎉 ¡Despliegue y ejecución completados exitosamente!"
        echo ""
        echo "📊 Resumen:"
        echo "✅ Notebooks desplegados: 00, 01, 02, 03, 04, 05 y select_tablas_vinko"
        echo "✅ Workflow creado: WF_ETL_VINKOS"
        echo "✅ Tareas configuradas: PreparacionAmbiente → IngestaBitacotaCtrlFile → ExisteArchivos → IngestaEstadisticos → Transform → LoadVisitantes → EliminarRaw"
        echo "✅ Compute configurado: Serverless"
        echo "🚀 Workflow ejecutado automáticamente"
        echo "next"
        echo "🔗 Accede a tu workspace de Databricks para ver los resultados detallados   "